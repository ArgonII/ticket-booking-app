
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ticket-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-booking-frontend
  template:
    metadata:
      labels:
        app: ticket-booking-frontend
    spec:
      containers:
        - name: frontend
          image: ticket-booking-app-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ticket-booking
spec:
  type: ClusterIP
  selector:
    app: ticket-booking-frontend
  ports:
    - port: 80
      targetPort: 80
