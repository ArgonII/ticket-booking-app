
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ticket-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-booking-backend
  template:
    metadata:
      labels:
        app: ticket-booking-backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "ticket-booking-backend"
        vault.hashicorp.com/service: "http://vault.vault.svc:8200"
        vault.hashicorp.com/agent-pre-populate-only: "true"

        vault.hashicorp.com/agent-inject-secret-db-password: "secret/data/ticket-booking/database"
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "secret/data/ticket-booking/database" -}}
          {{ .Data.data.password }}
          {{- end -}}

    spec:
      serviceAccountName: ticket-booking-backend
      containers:
        - name: backend
          image: ticket-booking-app-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD_FILE
              value: /vault/secrets/db-password
            - name: DB_NAME
              value: ticketbooking

          readinessProbe:
            httpGet:
              path: /api/events
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ticket-booking
spec:
  type: ClusterIP
  selector:
    app: ticket-booking-backend
  ports:
    - port: 3000
      targetPort: 3000
