
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ticket-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-booking-backend
  template:
    metadata:
      labels:
        app: ticket-booking-backend
    spec:
      containers:
        - name: backend
          image: ticket-booking-app-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ticket-booking-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-booking-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: ticket-booking-db-secret
                  key: POSTGRES_DB
          readinessProbe:
            httpGet:
              path: /api/events
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ticket-booking
spec:
  type: ClusterIP
  selector:
    app: ticket-booking-backend
  ports:
    - port: 3000
      targetPort: 3000
